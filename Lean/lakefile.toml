name = "extraction"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Extraction"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "REPL"
git = "https://github.com/leanprover-community/repl"
rev = "v4.27.0"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0"

[[lean_lib]]
name = "Extraction"